name: Validate subscription

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        run: |
          python3 tools/build.py
          python3 -m unittest discover -s tests -v
          git diff --exit-code -- dist
