name: 规则反馈
description: 报告可复现的误触、漏点或版本兼容问题
title: "[规则反馈] "
body:
  - type: markdown
    attributes:
      value: |
        请只提供必要的脱敏信息。不要提交完整备份、设备应用清单、账号资料、聊天内容或私人课表。
        收录不等于全部版本已验证；请先确认目标规则组已按需开启。
  - type: dropdown
    id: problem_type
    attributes:
      label: 问题类型
      options:
        - 误触了非目标控件
        - 目标出现但没有处理
        - 新版本界面变化
        - 其他规则问题
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: 应用名称与包名
      placeholder: "应用名称 / com.example.app"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: 应用版本与版本代码
      description: 版本代码未知时请注明未知，不要根据日期猜测。
    validations:
      required: true
  - type: input
    id: gkd_version
    attributes:
      label: GKD 版本及订阅版本
      placeholder: "GKD 版本 / 订阅版本"
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: 规则组名称、组 key 与规则 key
      description: 未知的字段可以注明未知；请同时说明该组是否已开启。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 描述从哪个页面、经过哪些操作出现目标，不要包含私人页面文字。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期与实际结果
      description: 请说明目标是否可见、是否发生点击及点击后的页面变化。仅有触发记录不一定代表操作生效。
    validations:
      required: true
  - type: textarea
    id: optional_context
    attributes:
      label: 可选的脱敏补充
      description: 可以填写相关 Activity、控件资源 ID 或最小节点片段；不要粘贴完整调试数据或快照链接。
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 我已检查内容，不包含账号、联系方式、聊天记录、课程安排等个人信息。
          required: true
